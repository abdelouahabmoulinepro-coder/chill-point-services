# Créez ce fichier automatiquement avec : python scripts/configurer_acces.py
# Ne publiez jamais le fichier réel .streamlit/secrets.toml.

[access]
login_id = "dirigeant"
display_name = "Dirigeant"
password_hash = "REMPLACER_PAR_LE_HASH_ARGON2ID"
# Secret aléatoire distinct du mot de passe, généré par configurer_acces.py.
session_secret = "REMPLACER_PAR_UN_SECRET_ALEATOIRE_48_OCTETS"

[database]
# Utilisez "sqlite" pour le développement local/Docker avec volume persistant.
# Utilisez "postgres" uniquement après avoir renseigné l'URI du Session pooler.
backend = "sqlite"
# Pour PostgreSQL, recopiez le Project ref affiché dans Supabase Project Settings.
project_ref = ""
# URI Session pooler Supabase (IPv4), avec TLS obligatoire.
# Exemple de forme uniquement — ne publiez jamais la valeur réelle :
# url = "postgresql://ROLE.PROJECT_REF:MOT_DE_PASSE@HOST:5432/postgres?sslmode=require"
url = ""
